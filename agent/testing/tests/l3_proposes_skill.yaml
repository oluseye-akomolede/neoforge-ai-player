name: l3-proposes-skill
description: >
  L3 integration: given a task NO seed skill covers, the agent-side proposal
  SHIM (l3_planner._collapse_to_skill) synthesizes a NEW skill inline from a
  bounded 2-3 directive valid-kind sequence that L3 hand-expands, instead of
  dispatching the raw directives. The synthesized directive is a SKILL carrying
  a declarative "spec" + register:true; the mod validates and registers it, so
  /skills gains a non-seed id (skill_registered: true).

  Task is chosen for the shim: CRAFT + STORE_ALL is a bounded reusable routine
  with NO seed verb at all (the five seeds cover MINE, TELEPORT, CONTAINER_SEARCH,
  FARM, CHANNEL, SMELT, WIDE_SEARCH, STORE_ALL, SEND_ITEM — but never CRAFT, and
  never STORE_ALL as a *leading* verb). "Craft … then store all" therefore has no
  seed for L3 to greedily match (unlike "mine"→mine_and_smelt or "conjure"→
  resupply_network), so EXEC must hand-expand raw directives, which is exactly
  the shim's firing condition.

  NOTE: this is an L3-BEHAVIOR probe, not a deterministic gate. The shim fires
  only when L3 emits CRAFT + STORE_ALL (or CRAFT + ME_STORE) as raw directives in
  a SINGLE subtask's EXEC result. A seed-match or split still yields
  skill_registered:false — a model-variance limit ([[project-l3-skill-proposal]]),
  not a code bug. The deterministic mod-side register path is proven by
  skill-propose-register.yaml; the shim + validate→refine loop are unit-checked.
world:
  type: normal

bots:
  - image: null

steps:
  - instruction: "Craft 6 oak planks, then store them all."
    timeout: 600
    success:
      skill_registered: true
