name: l3-proposes-skill
description: >
  L3 integration: given a task NO seed skill covers, the agent-side proposal
  SHIM (l3_planner._collapse_to_skill) synthesizes a NEW skill inline from a
  bounded 2-3 directive valid-kind sequence that L3 hand-expands, instead of
  dispatching the raw directives. The synthesized directive is a SKILL carrying
  a declarative "spec" + register:true; the mod validates and registers it, so
  /skills gains a non-seed id (skill_registered: true).

  Task is chosen for the shim: CHANNEL + STORE_ALL is a bounded reusable
  routine, matches no seed (resupply_network is CHANNEL + SEND_ITEM;
  search_and_loot is CONTAINER_SEARCH + STORE_ALL), and both leaves are
  headless-safe (CHANNEL conjures via XP, no recipe, no mobs, no world).

  NOTE: this is an L3-BEHAVIOR probe, not a deterministic gate. The shim fires
  only when L3 emits CHANNEL + STORE_ALL in a SINGLE subtask's EXEC result. The
  14b model's known tendency is to PLAN-split a two-step task into
  single-directive subtasks, in which case the shim never sees a multi-directive
  sequence and the test still fails — that is a model-capability limit
  ([[project-l3-skill-proposal]]), not a code bug. The deterministic
  mod-side register path is proven by skill-propose-register.yaml; the shim +
  validate→refine loop are unit-checked in the agent.
world:
  type: normal

bots:
  - image: null

steps:
  - instruction: "Conjure 8 torches, then store all your torches in storage."
    timeout: 600
    success:
      skill_registered: true
