name: l3-proposes-skill
description: >
  L3 integration: given a task NO seed skill covers, L3 should synthesize a NEW
  skill inline (a SKILL directive whose extra carries a declarative "spec" +
  "register":true) rather than hand-expanding raw directives. The mod validates
  and registers it, so /skills gains a non-seed id. Verified via skill_registered
  (a new skill id beyond the five seeds). Confirms the agent-side spec wrap +
  mod-side resolveSpec/validate/register path end-to-end.

  The task is deliberately chosen to have NO seed coverage AND to resist the
  PLAN phase's tendency to split: EQUIP_ALL + CHANNEL. EQUIP_ALL is the prompt's
  own canonical "unverifiable prep step" (the proposal example is equip_and_fight
  = EQUIP_ALL + COMBAT), so PLAN is least likely to peel it into its own
  subtask; and EQUIP_ALL + CHANNEL matches no seed (resupply_network is
  CHANNEL + SEND_ITEM, so a bare conjure would collapse but equip+conjure will
  not). "Gear up" frames it as one reusable routine so EXEC proposes rather than
  hand-expanding. Both leaves are headless-safe (no mobs, no world, no recipe).

  NOTE: this is an L3-BEHAVIOR probe, not a deterministic gate. It passes only
  when qwen2.5:14b actually emits an inline-spec SKILL proposal. It does not
  currently: across three task shapes (conjure+store, meditate+conjure,
  equip+conjure) L3 never proposes — it either matches a seed ("conjure X" ->
  resupply_network) or PLAN-splits the task into single-directive subtasks
  (sometimes inventing a trivial "ensure in overworld" subtask and ignoring
  EQUIP_ALL entirely). That is LLM variance, not a code bug — the mod-side path
  is proven deterministically by skill-propose-register.yaml.
world:
  type: normal

bots:
  - image: null

steps:
  - instruction: "Gear up for conjuring: equip your best gear, then conjure 8 torches."
    timeout: 600
    success:
      skill_registered: true
