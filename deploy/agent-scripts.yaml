# The M2 scripts, delivered to the agent pods as files.
#
# scout.js is the first script (task 8.2). It lives here rather than baked into
# the image so a script change does not need a rebuild -- but that only holds if
# the pod actually MOUNTS this, which the step-4 TEST plan does.
#
# `bindings` is the bot-to-script map, and it is the ONLY switch that turns
# script mode on for a bot: {"Scout": "scout.js"}. It replaced a `"script":
# "<path>"` key in the bot's profile, for a reason worth keeping recorded -- the
# profiles directory is an emptyDir seeded from the image, so a profile edit
# survived only until the next pod restart, and the plan's "rollback restores
# that file" story was false the moment anything restarted the pod. Bindings
# live in the ConfigMap, so they survive restarts and the rollback is deleting
# the entry.
#
# No bindings entry means no script: a bot absent from this map runs the
# planner exactly as before, which is the safe default for all five bots.
#
# Everything below is GENERATED by scripts/gen-scripts-cm.py from
# agent/scripts/. Edit the .js or bindings.json, then regenerate; do not
# hand-edit the generated blocks.

apiVersion: v1
kind: ConfigMap
metadata:
  name: agent-scripts
  labels:
    app: aibot-agent
data:
  bindings.json: |
    {
      "Scout": "scout.js"
    }
  scout.js: |
    // scout.js — the M2 first script (task 8.2). One bot, one action.
    //
    // Written against the runner's real surface (agent-script-runner
    // src/engine.js): a frozen global `snapshot`, and `api.do`, `api.say`,
    // `api.send`, `api.remember`, `api.recall`, `api.log`. The script runs once
    // per tick in a disposable sandbox, so it keeps no state between ticks except
    // through `api.remember` / `api.recall`.
    //
    // M2 scope is deliberately one action. The point of 8.2 is not that the bot
    // does something clever: it is that the SAME action reaches the mod whether a
    // script or the LLM asked for it. A narrow script keeps the comparison honest.

    var GOAL = "scout_store";

    // Directive statuses that mean the directive is OVER. Taken from
    // DirectiveStatus.java (exactly ACTIVE, COMPLETED, FAILED, CANCELLED) and
    // Directive.toMap() (Directive.java:63 writes `status.name()`), so these are
    // the literal wire strings, not a guess at the enum's spelling.
    //
    // ACTIVE is the only in-flight status; it is deliberately NOT listed. Every
    // terminal status leaves BotBrain's `activeDirective` null, so a directive in
    // one of these three is finished and the bot is free to act.
    var TERMINAL_STATUSES = ["COMPLETED", "FAILED", "CANCELLED"];

    // True only when the payload POSITIVELY says nothing is running.
    //
    // Two separate questions, both answered from the producer's own fields:
    //   - has a directive ever finished, and is it still the retained one
    //     (`directive.status` terminal), or
    //   - has one never started (`progress.phase` idle, the never-run shape).
    //
    // Anything else - an unknown status, a missing directive, a missing progress
    // block - returns false and the caller HOLDS. That asymmetry is the point: a
    // shape we cannot read must not be mistaken for an idle bot.
    function _noDirectiveInFlight(task) {
      if (!task || typeof task !== "object") return false;
      var directive = task.directive;
      if (directive && typeof directive === "object" &&
          typeof directive.status === "string" &&
          TERMINAL_STATUSES.indexOf(directive.status) !== -1) {
        return true;
      }
      var progress = task.progress;
      if (progress && typeof progress === "object" && progress.phase === "idle") {
        return true;
      }
      return false;
    }

    function tick() {
      // No snapshot means the agent sent none. Doing anything here would be acting
      // on a guess, so say so once and propose nothing.
      if (typeof snapshot === "undefined" || snapshot === null) {
        api.log("scout: no snapshot this tick, proposing nothing");
        return;  // propose nothing: the runner reads api.do, not this value
      }

      // The envelope's shape is {tick, server_ms, state, events, task}; the bot
      // facts live under `state`, not at the top. Reading `snapshot.health` here
      // gave undefined, so `typeof health === "number"` short-circuited and this
      // guard NEVER FIRED - a bot at health 3 still proposed an action. Every test
      // missed it because the fixtures fed the flat object the script wanted
      // rather than the envelope the cache produces; the guard is now tested
      // against an envelope built through SnapshotCache.
      var state = (snapshot.state || {});

      // Only act once we are actually healthy enough to move. A starved or hurt
      // bot acting on a stale plan is how a bot walks into lava while it is
      // already fleeing something.
      var health = state.health;
      if (typeof health === "number" && health < 8) {
        api.log("scout: health " + health + " too low, holding");
        return;  // propose nothing: the runner reads api.do, not this value
      }

      // STORE_ALL must not fire on every idle tick.
      //
      // WHAT: STORE_ALL is a bank-everything directive. Firing it unconditionally
      // on every tick means a bot that is already unloaded pays for a full store
      // pass every tick, forever, and the mod queues a directive per tick.
      //
      // WHY THE OBVIOUS GUARD IS WRONG: a guard that reads the wrong path silently
      // never fires - the same class as the health guard above. `state.inventory`
      // is a LIST, and always has been: snapshot.py:43 declares "inventory": [] in
      // _EMPTY_STATE, and build_state's _obs unwraps the game's one-key envelope
      // (HttpApiServer.java:469 answers {"inventory": [...]}) before storing it.
      //
      // This code used to read `state.inventory.inventory`, on the theory that the
      // endpoint's wrapper reached the script verbatim. It never did: the wrapper
      // is a mod-side transport detail and the contract always promised a list.
      // When _obs started unwrapping at the source (b9edb63) that read became
      // undefined and this guard stored nothing, permanently - caught by
      // test_the_scripts_inventory_path_resolves. Read the list the contract
      // promises; if a future message carries a wrapper, `state.inventory.inventory`
      // is an integration bug to fix at the producer, not to paper over here.
      //
      // A FAILED inventory read degrades to `[]` (snapshot.py's _read default), and
      // the fallback below reads that as "nothing to store" - under-acting, never
      // over-acting.
      //
      // WHEN: only when there is something to store, and not again for the same
      // inventory for a while. The cooldown is stored as the tick number it was
      // last fired at, compared against the current tick, rather than a countdown:
      // `api.recall()` returns the blob this tick STARTED with, so a value
      // decremented and remembered in the same tick is not visible until the next
      // one (agent-script-runner engine.js:398-406). A tick-number stamp needs no
      // decrement and cannot drift if ticks are skipped.
      var STORE_ALL_COOLDOWN_TICKS = 100;
      var inv = Array.isArray(state.inventory) ? state.inventory : [];
      if (!Array.isArray(inv) || inv.length === 0) {
        // This guard runs before the task check, so this line fires both for a bot
        // carrying nothing and for one mid-store that already deposited everything.
        // Say which, because these log lines are evidence in the C1/C4 arms and the
        // second case must not read as the guard misfiring.
        api.log("scout: inventory empty, not storing (" +
                ((snapshot.task && snapshot.task.progress &&
                  snapshot.task.progress.phase === "idle") ? "idle" : "already deposited") + ")");
        return;  // propose nothing: the runner reads api.do, not this value
      }
      var now = (typeof snapshot.tick === "number") ? snapshot.tick : 0;
      // `api.recall()` returns the decoded STRING the game sent, and `remember`
      // takes a single string blob (contract §4.1). So the memory is JSON text on
      // the wire and must be parsed here; reading a property off the raw string
      // yields undefined and the cooldown never engages.
      var mem = {};
      try {
        mem = JSON.parse(api.recall() || "{}") || {};
      } catch (e) {
        mem = {};  // a corrupt blob must not wedge the bot: store rather than stall
      }
      var lastStore = (typeof mem.lastStoreAllTick === "number") ? mem.lastStoreAllTick : null;
      if (lastStore !== null && now - lastStore < STORE_ALL_COOLDOWN_TICKS) {
        api.log("scout: stored at tick " + lastStore + ", cooling down");
        return;  // propose nothing: the runner reads api.do, not this value
      }

      // The task we are on. `snapshot.task` is the directive the agent is
      // currently running, so a script does not start a second job underneath one
      // already in flight.
      //
      // It is NOT null when idle. Measured on TEST 2026-11-12, api.get_directive
      // returns, at rest:
      //   {"state":"Standing by","self_preservation":"ok","progress":{"phase":"idle"}}
      // and, mid-task:
      //   {"state":"Wide search ...","directive":{"id":7,"status":"ACTIVE",...},
      //    "progress":{"phase":"pathing_to_cell","recent_events":[...]}}
      // So `if (snapshot.task)` was ALWAYS true and this script never acted: an
      // idle bot looked busy. The discriminator is progress.phase === "idle", not
      // the presence of the object. The fixtures in test_scout_script.py are copied
      // from those two real responses, not constructed from what this script
      // expects -- a hand-built idle `null` would have confirmed the wrong guard,
      // which is exactly how the snapshot.state bug at line 30 survived every test.
      // Hold unless NO DIRECTIVE IS IN FLIGHT. "In flight" is everything else,
      // including a directive that carries no status or no progress block --
      // an older mod, a shape we have not seen, or a bare test directive. Writing
      // this as `status !== "ACTIVE"` alone would let a directive we cannot read
      // through as idle, which is the unsafe direction: the script would start a
      // second job underneath an unknown one. Both openings below are POSITIVE
      // evidence, never the absence of a block.
      //
      // TWO openings, and the second is the M3-1b fix:
      //
      //   1. `progress.phase === "idle"` -- a never-run bot. Measured on TEST
      //      2026-11-12 (see above).
      //
      //   2. `directive.status` is a TERMINAL status. This is the case the phase
      //      test cannot see. On SUCCESS/FAILED/CANCELLED BotBrain.java:96/:109/
      //      :121 swap `activeBehavior` to idleBehavior but leave `lastProgress`
      //      holding the behaviour's final phase, and :190 keeps reporting it for
      //      as long as `lastDirective` is set -- which is forever. So a bot whose
      //      plan finished reports phase "done"/"skill:done"/"failed"/"cancelled"
      //      beside a state of "Standing by", every tick, and the phase test held
      //      it permanently. The gate was keyed on the wrong field: the question is
      //      "is a directive in flight", and `status` answers it directly.
      //
      // DirectiveStatus (DirectiveStatus.java) is exactly ACTIVE, COMPLETED,
      // FAILED, CANCELLED, and Directive.toMap() (Directive.java:63) writes
      // `status.name()`, so the wire values are those four uppercase names. ACTIVE
      // is the only in-flight one; the other three all leave `activeDirective`
      // null. An unrecognised status is NOT treated as terminal -- it holds, same
      // as an unreadable directive.
      //
      // NOTE on the state field, because the obvious reading of it is wrong:
      // `state` is `describeState()`, and IdleBehavior.describeState()
      // (IdleBehavior.java:24) returns "Standing by", NOT "idle". `activeBehavior`
      // is never null -- it is constructed to idleBehavior at BotBrain.java:29 and
      // restored there on every terminal path -- so the literal "idle" at
      // BotBrain.java:180 is unreachable in the payload. Gating on
      // `state === "idle"` would never fire. `state` still reads as a person
      // description of what the bot is doing, so it is logged, never tested.
      var task = snapshot.task;
      if (task && !_noDirectiveInFlight(task)) {
        // Say WHY we are holding. Returning silently here made a held bot
        // indistinguishable from a script that was never called: on test
        // 2026-11-19 the log carried zero dispatch lines for a bot holding 16
        // cobblestone, and that silence was read as "the script is not running".
        //
        // Name the status when there is one, because since M3-1b that is what the
        // decision turns on. Three distinguishable cases, because an operator
        // reads these lines to tell them apart:
        //   - a status we do not recognise (not terminal, so we held)
        //   - no status at all (a shape we cannot read)
        //   - no progress block either (same, and worth saying separately)
        var heldStatus = (task.directive && typeof task.directive.status === "string")
          ? task.directive.status : null;
        var heldPhase = (task.progress && typeof task.progress === "object" &&
                         typeof task.progress.phase === "string")
          ? task.progress.phase : null;
        var why = heldStatus
          ? "unrecognised directive status " + heldStatus
          : (heldPhase ? "no directive status" : "no progress phase");
        api.log("scout: holding, " + why +
                ", phase " + (heldPhase || "(none)") +
                ", state " + (task.state || "(none)"));
        return;  // propose nothing: the runner reads api.do, not this value
      }

      // THE ACTION. This is the one 8.2 compares, and TWO things about it matter.
      //
      // HOW: it goes through `api.do`, NOT a returned array. The runner collects
      // actions only from api.do calls during the tick (agent-script-runner
      // src/worker.js:86 `actions: state.actions ?? []`), and its contract is
      // explicit that a script's return value is IGNORED (src/engine.js, §4.4).
      // This script used to `return [{kind:"STORE_ALL"}]` from tick() and end with
      // a bare `tick();`: the value went nowhere, state.actions stayed empty on
      // every tick, and the mod was never asked to do anything. Measured on TEST
      // 2026-11-13 against the live runner - the committed bytes gave
      // {"status":"ok","actions":[]} while a probe identical except for calling
      // api.do gave actions:[{directive:"STORE_ALL"}]. The test that should have
      // caught it REWROTE this file's `tick();` into `;return tick();` before
      // evaluating, so it asserted on a contract the runner does not implement.
      //
      // WHAT: `STORE_ALL` takes an OPTIONAL coordinate triple
      // (StoreAllBehavior.java:62 `if (directive.hasLocation())`), and when it has
      // one it stores into that specific container and moves the bot there (:171).
      // Leaving the coordinates off asks the mod to choose, which is the form the
      // planner's own seed match produces (agent.py:1888 -- its pattern has no
      // capture groups).
      //
      // This script emits the COORDLESS form on purpose, and 8.2 pins that form.
      // Every producer in this repo emits it coordless: the planner's own seed
      // match (agent.py:1888) returns a bare object because its pattern has no
      // capture groups, and the mod's seed specs put the coordinates on AREA_LOOT
      // with STORE_ALL bare beside it (SkillRegistry.java:154). The coordless form
      // is therefore the plausible call, and a constructed fixture should
      // construct that one.
      api.do("STORE_ALL", {});
      // Stamp the tick we fired at, so the next tick can cool down. One string
      // blob per the contract: preserve keys we do not own, since the memory is
      // shared with the planner's own usage.
      mem.lastStoreAllTick = now;
      api.remember(JSON.stringify(mem));
    }

    // Called explicitly so a syntax error surfaces as a script failure rather than
    // as an empty action list. The call is the contract: whatever tick() does to
    // api.do is what the runner collects. tick() returns nothing, and nothing
    // reads it - returning an array here would be discarded (§4.4).
    tick();
