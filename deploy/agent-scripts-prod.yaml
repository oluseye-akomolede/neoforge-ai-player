# ConfigMap agent-scripts -- PROD (namespace: minecraft)
#
# Step 4 of the PTC prod rollout: Mystic becomes the first prod bot that runs a
# script. TEST already runs this ConfigMap (ns minecraft-test) with Scout bound;
# prod has no such object yet (checked live 2026-11-22 12:0xZ:
# `kubectl -n minecraft get configmap agent-scripts` -> NotFound).
#
# WHY A SEPARATE PROD FILE rather than editing deploy/agent-scripts.yaml:
# that file is the TEST ConfigMap and is pinned by test's live object, whose
# bindings.json is `{"Scout": "scout.js"}`. Binding Mystic there would put a prod
# bot's script on TEST. The scripts differ per bot anyway, so the two namespaces
# are separate objects with separate content.
#
# WHY THE BINDING IS REQUIRED, not optional: agent.py:4297-4306 -- a bot named
# in SCRIPT_BOTS but ABSENT from bindings.json "has no script and runs the
# planner exactly as before". Setting SCRIPT_BOTS=Mystic with no Mystic entry
# would leave prod byte-for-byte unchanged in behaviour while looking enabled.
# The env var only decides which bots MAY reach the script surface; the binding
# decides which actually have a script.
#
# Generated from agent/scripts/ the same way the TEST file is. Edit the source
# and regenerate; do not hand-edit the data block.
apiVersion: v1
kind: ConfigMap
metadata:
  name: agent-scripts
  namespace: minecraft
data:
  bindings.json: |
    {
      "Mystic": "mystic.js"
    }
  mystic.js: |
    // mystic.js — the prod step-4 script: one bot, one scripted action.
    //
    // This exists to demonstrate the P6 claim ON PRODUCTION: a bot bound in
    // `agent-scripts`' bindings map runs a script, while every other bot keeps the
    // planner. It is deliberately the same shape as scout.js -- one action, no
    // cleverness -- because what is being tested is the WIRING (ConfigMap mounted,
    // SCRIPTS_DIR read, binding honoured), not the script's intelligence.
    //
    // Written against the runner's real surface (agent-script-runner src/engine.js):
    // a frozen global `snapshot`, and `api.do`, `api.say`, `api.send`,
    // `api.remember`, `api.recall`, `api.log`. The script runs once per tick in a
    // disposable sandbox, so it keeps no state between ticks except through
    // `api.remember` / `api.recall`.
    //
    // WHY THE GUARDS ARE COPIED FROM scout.js RATHER THAN SIMPLIFIED: each one in
    // scout.js marks a measured failure, and a fresh script repeating the mistake
    // would be a regression with a new name. The cost of the guards is a few
    // comparisons per tick; the cost of dropping them is a wedged bot.

    // Directive statuses that mean the directive is OVER. From DirectiveStatus.java
    // (exactly ACTIVE, COMPLETED, FAILED, CANCELLED) via Directive.toMap()
    // (Directive.java:63 writes `status.name()`), so these are the literal wire
    // strings. ACTIVE is the only in-flight status and is deliberately not listed.
    var TERMINAL_STATUSES = ["COMPLETED", "FAILED", "CANCELLED"];

    // The block Mystic is asked to gather, and how many. `target` is REQUIRED for
    // MINE: action_binding.py:70 declares _REQUIRED_FIELDS["MINE"] = ("target",),
    // and a MINE sent without one binds cleanly and then kills the bot's tick loop
    // (planner.py:196-200 records the wedge; agent.py:1888's seed match for MINE
    // carries no coordinates because the mod's seed specs put them on AREA_LOOT).
    // So `target` is not optional here and must be a block id, never a position.
    var TARGET = "minecraft:dirt";
    var COUNT = 3;
    var RADIUS = 128;

    // Cooldown, in ticks, between MINE dispatches. Distinct from scout.js's
    // STORE_ALL cooldown because it is a different action, but the reason for a
    // tick-number stamp over a countdown is identical and is worth not re-learning:
    // `api.recall()` returns the blob this tick STARTED with, so a value
    // decremented and remembered in the same tick is not visible until the next one
    // (engine.js:398-406). A tick stamp needs no decrement and cannot drift.
    var MINE_COOLDOWN_TICKS = 200;

    // True only when the payload POSITIVELY says nothing is running. Copied
    // verbatim from scout.js; see its comment for why the asymmetry matters -- an
    // unreadable shape returns false and the caller HOLDS.
    function _noDirectiveInFlight(task) {
      if (!task || typeof task !== "object") return false;
      var directive = task.directive;
      if (directive && typeof directive === "object" &&
          typeof directive.status === "string" &&
          TERMINAL_STATUSES.indexOf(directive.status) !== -1) {
        return true;
      }
      var progress = task.progress;
      if (progress && typeof progress === "object" && progress.phase === "idle") {
        return true;
      }
      return false;
    }

    function tick() {
      // No snapshot means the agent sent none. Acting would be acting on a guess.
      if (typeof snapshot === "undefined" || snapshot === null) {
        api.log("mystic: no snapshot this tick, proposing nothing");
        return;  // propose nothing: the runner reads api.do, not this value
      }

      // The envelope is {tick, server_ms, state, events, task}; bot facts live
      // under `state`. scout.js:58-66 records the measured bug where reading
      // `snapshot.health` left a health-3 bot acting, because the guard never
      // fired against an envelope. Same path here.
      var state = (snapshot.state || {});

      // Only act when healthy enough to move. A hurt bot acting on a mining plan is
      // a bot that mines into lava while already fleeing something.
      var health = state.health;
      if (typeof health === "number" && health < 8) {
        api.log("mystic: health " + health + " too low, holding");
        return;  // propose nothing
      }

      // Hold unless NO DIRECTIVE IS IN FLIGHT -- both openings are POSITIVE
      // evidence (progress.phase idle, or a terminal directive.status), never the
      // absence of a block. scout.js:161-215 has the measurements behind both; the
      // case it exists for is a finished bot that reports phase "done" forever
      // beside state "Standing by".
      var task = snapshot.task;
      if (task && !_noDirectiveInFlight(task)) {
        var heldStatus = (task.directive && typeof task.directive.status === "string")
          ? task.directive.status : null;
        var heldPhase = (task.progress && typeof task.progress === "object" &&
                         typeof task.progress.phase === "string")
          ? task.progress.phase : null;
        var why = heldStatus
          ? "unrecognised directive status " + heldStatus
          : (heldPhase ? "no directive status" : "no progress phase");
        api.log("mystic: holding, " + why + ", phase " + (heldPhase || "(none)"));
        return;  // propose nothing
      }

      // Cooldown, so an idle bot does not queue a MINE every tick forever. Read the
      // shared memory defensively: it is a single JSON string blob (contract §4.1),
      // and a corrupt blob must not wedge the bot.
      var now = (typeof snapshot.tick === "number") ? snapshot.tick : 0;
      var mem = {};
      try {
        mem = JSON.parse(api.recall() || "{}") || {};
      } catch (e) {
        mem = {};  // corrupt blob: mine rather than stall
      }
      var lastMine = (typeof mem.lastMineTick === "number") ? mem.lastMineTick : null;
      if (lastMine !== null && now - lastMine < MINE_COOLDOWN_TICKS) {
        api.log("mystic: mined at tick " + lastMine + ", cooling down");
        return;  // propose nothing
      }

      // THE ACTION. Through `api.do`, never a return value: the runner collects
      // actions only from api.do calls during the tick (src/worker.js:86
      // `actions: state.actions ?? []`) and ignores tick()'s return (§4.4).
      // scout.js:218-232 records the measured bug where returning an array gave
      // {"status":"ok","actions":[]} while a probe calling api.do gave one action.
      //
      // `target` and `count` are the fields action_binding.py allows and MINE
      // requires; `radius` bounds the search the way WIDE_SEARCH does.
      api.do("MINE", { target: TARGET, count: COUNT, radius: RADIUS });
      api.log("mystic: dispatched MINE " + TARGET + " count " + COUNT);

      // Stamp the tick, preserving keys we do not own -- the memory is shared with
      // the planner's own usage.
      mem.lastMineTick = now;
      api.remember(JSON.stringify(mem));
    }

    // Called explicitly so a syntax error surfaces as a script failure rather than
    // as an empty action list. tick() returns nothing and nothing reads it (§4.4).
    tick();
