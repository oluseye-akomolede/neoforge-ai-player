# The prod script surface for PTC step 4 -- deliberately EMPTY.
#
# This ConfigMap binds nothing. It exists only so that the prod agent pod has a
# readable SCRIPTS_DIR (a mounted ConfigMap volume at /srv/aibot-scripts), which
# `_bound_script_path` requires before it will consider scripts at all. With
# `bindings.json` = {}, `bindings.get(self.name)` returns None for every bot, so
# `_bound_script_path` returns None and the bot keeps running the planner
# (agent/agent.py:3979-3980, and :3935-3947 for the "absence means the planner"
# contract).
#
# WHY EMPTY IS THE POINT. Step 4 tests the owner's framework: the planner writes
# the script for the 3-dirt task. A bot listed in bindings.json would run a
# hand-written file instead and the planner could never bind its own --
# `_bind_planner_script` refuses when a hand-written binding is deployed, and
# does so deliberately and first (agent/agent.py:3998-4001, enforced at
# :4024-4029). So a binding here would defeat the step rather than support it.
#
# What routes Mystic to the script surface is SCRIPT_BOTS=Mystic in the
# Deployment, not this file: naming a bot in SCRIPT_BOTS routes it through the
# L3 plan layer, where the script surface is spliced into the prompt
# (agent/planner.py:318-321). SCRIPTS_DIR is still required on top of that
# because there is no baked-in fallback -- unset, script mode is disabled rather
# than binding the image's own copy, a failure measured on TEST 2026-11-11
# (agent/agent.py:3950-3961).
#
# Rollback: delete this ConfigMap and remove the scripts volume, mount and the
# three script env vars from the Deployment. Nothing here holds a script to
# restore.
#
# No `bindings.json` entries means no hand-written script, so there is no
# generated block here and no gen-scripts-cm.py run for prod: the empty file IS
# the content. An empty object is the documented way to say "planner for every
# bot" (deploy/agent-scripts.yaml:16).

apiVersion: v1
kind: ConfigMap
metadata:
  name: agent-scripts
  labels:
    app: aibot-agent
data:
  bindings.json: |
    {}
